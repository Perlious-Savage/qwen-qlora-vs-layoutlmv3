name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scoring code is byte-identical to Project 1's
        # Without this the like-for-like comparison is a claim rather than a fact.
        run: sha256sum -c VENDORED.sha256
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qwen-cord-extraction .
      - name: Service starts and responds without a GPU
        run: |
          docker run -d -p 8000:8000 --name api qwen-cord-extraction
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/openapi.json > /dev/null
          docker rm -f api
